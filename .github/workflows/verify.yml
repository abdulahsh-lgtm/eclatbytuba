name: Verify code

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - fix/phase-1-2-payment-verification
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eclat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eclat_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eclat_ci
      AUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Validate Prisma schema
        run: pnpm --filter @eclat/db exec prisma validate --schema prisma/schema.prisma
      - name: Prepare Prisma baseline for disposable CI database
        run: |
          if [ ! -f packages/db/prisma/migrations/0_init/migration.sql ]; then
            mkdir -p packages/db/prisma/migrations/0_init
            pnpm --filter @eclat/db exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > packages/db/prisma/migrations/0_init/migration.sql
          fi
      - name: Apply migrations to disposable CI database
        run: pnpm --filter @eclat/db exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Run auth security tests
        run: pnpm --filter @eclat/auth test:security
      - name: Run checkout and payment security tests
        run: pnpm --filter @eclat/db test:security:all
      - name: Test checkout idempotency and inventory concurrency against PostgreSQL
        run: pnpm --filter @eclat/db test:database
      - name: Test admin fulfillment API against PostgreSQL
        run: pnpm --filter @eclat/web test:orders:integration
      - name: Typecheck storefront
        run: pnpm --filter @eclat/web exec tsc --noEmit
      - name: Typecheck admin
        run: pnpm --filter @eclat/admin exec tsc --noEmit
      - name: Typecheck database package
        run: pnpm --filter @eclat/db exec tsc --noEmit
      - name: Build storefront
        run: pnpm --filter @eclat/web build
      - name: Build admin
        run: pnpm --filter @eclat/admin build
      - name: Commit generated lockfile and Prisma baseline on the working branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/fix/phase-1-2-payment-verification'
        run: |
          git add pnpm-lock.yaml packages/db/prisma/migrations/0_init/migration.sql
          if git diff --cached --quiet; then
            echo "Lockfile and baseline are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add pnpm lockfile and Prisma baseline"
          git push origin "HEAD:$GITHUB_REF_NAME"

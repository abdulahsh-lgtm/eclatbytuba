name: Verify code

on:
  push:
    branches:
      - main
      - fix/phase-1-2-payment-verification
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eclat_ci
      AUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @eclat/db exec prisma validate --schema prisma/schema.prisma
      - name: Run auth security tests
        run: pnpm --filter @eclat/auth test:security
      - name: Run checkout and payment security tests
        run: pnpm --filter @eclat/db test:security:all
      - name: Build storefront
        run: pnpm --filter @eclat/web build
      - name: Build admin
        run: pnpm --filter @eclat/admin build
